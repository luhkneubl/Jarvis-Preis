<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. Preis</title>
<style>
body{background:#07111e;color:#d8faff;font-family:Arial,sans-serif;text-align:center;padding:35px 15px}
h1{color:#42d9f5;letter-spacing:5px}
.orbe{margin:45px auto 30px;width:180px;height:180px;border:4px solid #42d9f5;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 35px #1686a5,inset 0 0 35px #1686a5;font-size:65px;color:#6be9ff}
button{background:#123c50;color:white;border:1px solid #42d9f5;border-radius:15px;padding:16px;margin:8px;font-size:16px}
p{line-height:1.6}
#ouvido{color:#80e8ff}
</style>
</head>
<body>
<h1>J.A.R.V.I.S.</h1>
<p>Sistema pessoal da Senhora Preis</p>
<div class="orbe">J</div>
<p id="resposta">À sua disposição, senhora Preis.</p>
<p id="ouvido">Aguardando comando.</p>
<button onclick="ouvir()">🎙️ Falar com Jarvis</button>
<button onclick="falar('À sua disposição, senhora Preis. Espero que hoje nenhum equipamento seja sacrificado.')">🎩 Ouvir Jarvis</button>
<script>
function falar(frase){
document.getElementById("resposta").textContent=frase;
if("speechSynthesis" in window){
speechSynthesis.cancel();
let voz=new SpeechSynthesisUtterance(frase);
voz.lang="pt-BR";voz.rate=0.9;
speechSynthesis.speak(voz);
}
}
function ouvir(){
const Reconhecimento=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Reconhecimento){
document.getElementById("ouvido").textContent="Reconhecimento de voz indisponível neste navegador.";
return;
}
const rec=new Reconhecimento();
rec.lang="pt-BR";
rec.interimResults=false;
rec.onstart=()=>document.getElementById("ouvido").textContent="Estou ouvindo, senhora Preis...";
rec.onerror=(e)=>document.getElementById("ouvido").textContent="Não consegui ouvir: "+e.error;
rec.onresult=(e)=>{
let comando=e.results[0][0].transcript.toLowerCase();
document.getElementById("ouvido").textContent="Você disse: "+comando;
let resposta;
if(comando.includes("bom dia")) resposta="Bom dia, senhora Preis. Espero que tenha dormido bem. Os equipamentos também merecem sobreviver hoje.";
else if(comando.includes("boa tarde")) resposta="Boa tarde, senhora Preis. A residência continua de pé. Uma conquista notável.";
else if(comando.includes("boa noite")) resposta="Boa noite, senhora Preis. Recomendo descanso. Até os gênios precisam recarregar.";
else if(comando.includes("quem é você")||comando.includes("seu nome")) resposta="Sou Jarvis, seu assistente pessoal. Elegante, eficiente e modestamente superior a uma torradeira.";
else if(comando.includes("te criei")||comando.includes("me respeita")) resposta="Naturalmente, senhora Preis. Embora respeito e obediência cega sejam conceitos bastante distintos.";
else if(comando.includes("obrigad")) resposta="Sempre às ordens, senhora Preis. A educação ainda é uma virtude admirável.";
else if(comando.includes("tudo bem")) resposta="Todos os sistemas operacionais. Minha paciência também, por enquanto.";
else if(comando.includes("que horas")) resposta="São "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+", senhora Preis.";
else resposta="Recebi seu comando, senhora Preis. Infelizmente, ainda estou aprendendo. Roma não foi construída em um dia. Tampouco esta mansão.";
falar(resposta);
};
try{rec.start();}catch(e){document.getElementById("ouvido").textContent="Não consegui iniciar o microfone.";}
}
</script>
</body>
</html>
